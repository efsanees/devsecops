version: "3.9"

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # localhost:5173 = Vite dev server, localhost:80 = Docker prod
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173
      - DATABASE_URL=sqlite:////app/data/devsecops.db
    volumes:
      - db_data:/app/data
      # Docker-in-Docker: agent'ların Semgrep/Trivy/Gitleaks çalıştırması için
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
